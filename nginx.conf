server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit path-only redirects — nginx listens on 80 but the host maps 5174,
    # so absolute redirects would drop the published port.
    absolute_redirect off;

    # Cross-origin isolation — required for Ketcher's WASM (SharedArrayBuffer).
    # These mirror the Vite dev-server headers; with them set, the bundled
    # coi-serviceworker.js fallback simply no-ops.
    #
    # WARNING: add_header does NOT inherit into any location block that declares
    # its own add_header. Every location below that sets Cache-Control must
    # therefore repeat these two lines, or cross-origin isolation silently drops
    # for that content type and the InChI WASM stops working.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Leave endpoint. The page beacons here on every pagehide — unconditionally,
    # there is no opt-in. Clear-Site-Data is the only mechanism that can evict
    # the immutable HTTP cache below, which no script can touch.
    #
    # WARNING — blast radius: Clear-Site-Data is scoped to the ORIGIN, not to
    # this path. Every hit clears cache and storage for the whole of
    # cheminfo.beilstein.org, including any other application served from it.
    # Safe only while this origin hosts nothing else that stores browser state.
    #
    # An exact-match location wins over both the asset regex and the
    # /explain-that-inchi/ prefix regardless of file order, so the beacon can
    # never fall through into the SPA try_files and return index.html.
    #
    # COOP/COEP are repeated here because they must be: per the warning above,
    # a location declaring its own add_header inherits none from the server
    # level, and dropping them would strip cross-origin isolation.
    location = /explain-that-inchi/__leave {
        add_header Clear-Site-Data '"cache","storage"' always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        return 204;
    }

    # Ketcher is genuinely large, so serving it uncompressed dominates first-load
    # time. Prefer the .gz siblings built by the Dockerfile — compressed once at
    # level 9, zero runtime CPU. gzip on stays as a fallback for any response
    # without a .gz sibling.
    #
    # The Indigo .wasm is now fetched as a real binary (11.8 MB -> 3.6 MB gzipped)
    # and the Dockerfile precompresses it, so gzip_static serves the .gz. Note
    # that gzip_static does NOT consult gzip_types — which is why application/wasm
    # stays out of the list below: a missing .gz should 404-to-identity rather than
    # have nginx gzip an 11.8 MB body per request.
    gzip_static on;
    gzip on;
    gzip_types application/javascript text/css image/svg+xml application/json;
    gzip_comp_level 5;
    gzip_vary on;

    # Content-hashed (assets/*-HASH.js) and version-named (indigo-ketcher-1.45.0
    # .wasm) files change name whenever their bytes change, so they can be cached
    # indefinitely. Matching by regex also keeps them out of the SPA fallback
    # below — a missing asset now 404s instead of silently returning index.html
    # with a JS content type.
    location ~* \.(js|mjs|css|woff2?|png|svg|wasm)$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The entry point must never be cached, or a user pins to a stale build and
    # never picks up a deploy. Reached both directly and via the try_files
    # fallback below (a URI argument re-runs location matching).
    location = /explain-that-inchi/index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
    }

    # The app is built with base=/explain-that-inchi/ and served from the
    # matching subdirectory.
    location /explain-that-inchi/ {
        try_files $uri $uri/ /explain-that-inchi/index.html;
    }

    location = / {
        return 302 /explain-that-inchi/;
    }
}
